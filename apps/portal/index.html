<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Responder Training</title>
  <!-- Inline Lucide truck favicon: matches the header logo and avoids the
       /favicon.ico 403 on S3. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23ef4444'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M14%2018V6a1%201%200%200%200-1-1H3a1%201%200%200%200-1%201v11a1%201%200%200%200%201%201h2'/%3E%3Cpath%20d='M15%2018H9'/%3E%3Cpath%20d='M19%2018h2a1%201%200%200%200%201-1v-3.65a1%201%200%200%200-.22-.624l-3.48-4.35A1%201%200%200%200%2017.52%208H14'/%3E%3Ccircle%20cx='17'%20cy='18'%20r='2'/%3E%3Ccircle%20cx='7'%20cy='18'%20r='2'/%3E%3C/svg%3E" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: white;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    header .hint { font-size: 12px; color: #64748b; }
    header .hint::before { content: "·"; margin-right: 8px; color: #475569; }
    .main { display: flex; flex: 1; overflow: hidden; }

    .viewer-panel {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid #334155;
      min-width: 0; overflow: hidden;
    }
    #scene-container {
      flex: 1; min-height: 0; width: 100%;
      position: relative; background: #000; overflow: hidden;
    }
    #scene-container canvas { display: block; width: 100% !important; height: 100% !important; }

    .video-bar {
      background: #1e293b; padding: 10px 16px;
      display: flex; flex-direction: column; gap: 9px;
      flex-shrink: 0; border-top: 1px solid #334155;
    }
    .transport-row { display: flex; align-items: center; gap: 12px; }

    /* Segmented control, not three loose buttons: one bordered group with
       hairline dividers, so the three lectures read as one choice. The IDs stay
       btn-vid1/2/3 — videosphere.ts and the in-VR HUD bind to them by id. */
    .lecture-group {
      display: inline-flex; align-self: flex-start;
      border: 1px solid #334155; border-radius: 7px; overflow: hidden;
    }
    .lecture-group button {
      background: transparent; border: none;
      border-left: 1px solid #334155;
      color: #94a3b8; padding: 5px 13px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    .lecture-group button:first-child { border-left: none; }
    .lecture-group button.active { background: #334155; color: #f1f5f9; font-weight: 600; }
    .lecture-group button:hover:not(.active) { background: #273449; color: #e2e8f0; }
    .lecture-group button:focus-visible { outline: 2px solid #3b82f6; outline-offset: -2px; }

    .video-summary { margin: 0; font-size: 11px; line-height: 1.45; color: #94a3b8; }
    .video-summary strong { color: #cbd5e1; }

    .video-bar .transport-row button {
      background: #3b82f6; border: none; border-radius: 6px;
      color: white; padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .video-bar .transport-row button:hover { background: #2563eb; }
    .video-bar .transport-row button#btn-mute { background: #475569; }
    .video-bar .transport-row button#btn-mute:hover { background: #64748b; }
    #video-time { font-size: 12px; color: #94a3b8; margin-left: auto; }
    #progress-bar-wrap {
      flex: 1; height: 24px; cursor: pointer; position: relative;
      user-select: none; touch-action: none;
      display: flex; align-items: center;
    }
    #progress-track {
      position: absolute; left: 0; right: 0; height: 6px;
      background: #334155; border-radius: 3px; overflow: hidden; pointer-events: none;
    }
    #progress-bar { height: 100%; background: #3b82f6; border-radius: 3px; width: 0%; pointer-events: none; }
    #progress-thumb {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; background: white; border-radius: 50%;
      pointer-events: none; left: 0%; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .chat-panel {
      width: 400px; flex-shrink: 0;
      display: flex; flex-direction: column; background: #0f172a;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
    .msg .bubble {
      padding: 10px 14px; border-radius: 12px;
      font-size: 13.5px; line-height: 1.55; word-break: break-word;
    }
    .msg.user { align-items: flex-end; }
    .msg.user .bubble {
      background: #b91c1c; color: #fef2f2; border-bottom-right-radius: 4px;
    }
    .msg.bot { align-items: flex-start; }
    .msg.bot .bubble {
      background: #1e293b; color: #e2e8f0;
      border-bottom-left-radius: 4px; border: 1px solid #334155;
    }
    .msg .label { font-size: 10.5px; color: #64748b; padding: 0 2px; }
    .msg.bot .bubble table {
      border-collapse: collapse; font-size: 12px; margin: 6px 0;
      width: 100%; overflow-x: auto; display: block;
    }
    .msg.bot .bubble th, .msg.bot .bubble td {
      border: 1px solid #334155; padding: 5px 8px; text-align: left;
    }
    .msg.bot .bubble th { background: #0f172a; font-weight: 600; }
    .msg.bot .bubble code {
      background: #0f172a; border-radius: 4px; padding: 1px 5px; font-size: 12px;
    }
    .msg.bot .bubble h3, .msg.bot .bubble h4 {
      margin: 8px 0 4px; color: #fca5a5; font-size: 13px;
    }
    .msg.bot .bubble ul, .msg.bot .bubble ol { padding-left: 18px; margin: 4px 0; }
    .msg.bot .bubble strong { color: #fecaca; }

    .typing .bubble {
      display: flex; gap: 5px; align-items: center; padding: 12px 16px;
    }
    .typing .bubble span {
      width: 7px; height: 7px; background: #64748b;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing .bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing .bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    .chat-input-wrap {
      border-top: 1px solid #334155;
      padding: 12px 16px; background: #1e293b; flex-shrink: 0;
    }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    #chat-input {
      flex: 1; background: #0f172a; border: 1px solid #334155;
      border-radius: 10px; color: #e2e8f0;
      font-size: 13.5px; padding: 10px 14px; resize: none; outline: none;
      max-height: 120px; line-height: 1.5; font-family: inherit;
    }
    #chat-input:focus { border-color: #ef4444; }
    #chat-input::placeholder { color: #475569; }
    #send-btn {
      background: #ef4444; border: none; border-radius: 10px;
      color: white; width: 40px; height: 40px; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s;
    }
    #send-btn:hover { background: #dc2626; }
    #send-btn:disabled { background: #334155; cursor: not-allowed; }
    #mic-btn {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 10px; color: #94a3b8;
      width: 40px; height: 40px; cursor: pointer;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #mic-btn:hover { background: #334155; color: #e2e8f0; }
    #mic-btn.recording {
      background: #7f1d1d; border-color: #ef4444; color: #fca5a5;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
    }
    .input-hint { font-size: 10.5px; color: #475569; margin-top: 6px; }

    /* Empty state. Removed by chat.ts on the first message and never rebuilt —
       a capability list is only useful before the conversation exists. */
    .chat-empty { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
    .chat-empty h2 { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    .chat-empty p  { font-size: 12.5px; color: #64748b; margin-bottom: 4px; }
    .prompt-chip {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      color: #cbd5e1; font-family: inherit; font-size: 12.5px; line-height: 1.4;
      padding: 9px 12px; text-align: left; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .prompt-chip:hover { background: #273449; border-color: #475569; }
    .prompt-chip:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

    #error-banner {
      display: none;
      align-items: center; gap: 6px;
      background: #450a0a; border: 1px solid #991b1b; color: #fca5a5;
      font-size: 12px; padding: 8px 14px; border-radius: 6px; margin-top: 8px;
    }

    /* -- Lucide icons (github.com/lucide-icons/lucide, ISC) --
       Paths for the JS-driven labels live in src/icons.ts; the ones inlined in
       the markup below are the pre-hydration state of the same buttons. */
    .icon { width: 15px; height: 15px; vertical-align: -2px; flex-shrink: 0; }
    header .logo-icon { width: 20px; height: 20px; vertical-align: 0; }
    .transport-row .icon { margin-right: 5px; }
    #mic-btn .icon, #send-btn .icon { width: 18px; height: 18px; vertical-align: 0; }
    #error-banner .icon { width: 14px; height: 14px; vertical-align: 0; }
  </style>
</head>
<body>

<header>
  <div class="logo"><svg class="icon logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
  <h1>360° Training</h1>
  <span class="hint">Drag to rotate</span>
</header>

<div class="main">

  <div class="viewer-panel">
    <!-- IWSDK World renders into this container -->
    <div id="scene-container"></div>

    <div class="video-bar">
      <div class="transport-row">
        <button id="btn-play"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg> Pause</button>
        <button id="btn-mute"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg> Mute</button>
        <div id="progress-bar-wrap" title="Click or drag to seek">
          <div id="progress-track"><div id="progress-bar"></div></div>
          <div id="progress-thumb"></div>
        </div>
        <span id="video-time">0:00 / 0:00</span>
        <button id="btn-enter-vr" title="Enter VR (or use IWER emulator on desktop)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/></svg> Enter VR</button>
      </div>

      <div class="lecture-group" role="group" aria-label="Lecture">
        <button id="btn-vid1" class="active" title="Part 1 — EV emergency-response fundamentals">Fundamentals</button>
        <button id="btn-vid2" title="Part 2 — charging system &amp; HV battery hardware">Charging &amp; Battery</button>
        <button id="btn-vid3" title="Part 3 — battery fire response &amp; disconnects">Fire Response</button>
      </div>

      <p id="video-summary" class="video-summary"></p>
    </div>

  </div>

  <div class="chat-panel">

    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <h2>Training Assistant</h2>
        <p>Ask about what you're watching.</p>
        <button class="prompt-chip" type="button">How do I shut down the high-voltage system?</button>
        <button class="prompt-chip" type="button">What do I do if the battery is on fire?</button>
        <button class="prompt-chip" type="button">Where are the no-cut zones?</button>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1"
          placeholder="Ask about this training"></textarea>
        <button id="mic-btn" title="Voice input" aria-label="Voice input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></button>
        <button id="send-btn" title="Send" aria-label="Send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
      </div>
      <div class="input-hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for newline </div>
      <div id="error-banner"></div>
    </div>
  </div>

</div>

<script type="module" src="/src/index.ts"></script>
</body>
</html>
