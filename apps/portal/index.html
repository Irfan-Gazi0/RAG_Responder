<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Responder Training</title>
  <!-- Inline Lucide truck favicon: matches the header logo and avoids the
       /favicon.ico 403 on S3. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23ef4444'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M14%2018V6a1%201%200%200%200-1-1H3a1%201%200%200%200-1%201v11a1%201%200%200%200%201%201h2'/%3E%3Cpath%20d='M15%2018H9'/%3E%3Cpath%20d='M19%2018h2a1%201%200%200%200%201-1v-3.65a1%201%200%200%200-.22-.624l-3.48-4.35A1%201%200%200%200%2017.52%208H14'/%3E%3Ccircle%20cx='17'%20cy='18'%20r='2'/%3E%3Ccircle%20cx='7'%20cy='18'%20r='2'/%3E%3C/svg%3E" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: white;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    header .hint { font-size: 12px; color: #64748b; }
    header .hint::before { content: "·"; margin-right: 8px; color: #475569; }
    .main { display: flex; flex: 1; overflow: hidden; }

    .viewer-panel {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid #334155;
      min-width: 0; overflow: hidden;
    }
    #scene-container {
      flex: 1; min-height: 0; width: 100%;
      position: relative; background: #000; overflow: hidden;
    }
    #scene-container canvas { display: block; width: 100% !important; height: 100% !important; }

    /* Three stacked rows (transport, topic picker, summary) share this bar, so
       its gap is doing the work a divider would. At 9px/10px padding they read
       as one dense block; these values are the smallest that still separate the
       rows. Height here is taken from the video, so don't inflate them further
       without checking the 100vh case on a headset. */
    .video-bar {
      background: #1e293b; padding: 15px 20px 17px;
      display: flex; flex-direction: column; gap: 14px;
      flex-shrink: 0; border-top: 1px solid #334155;
    }
    .transport-row { display: flex; align-items: center; gap: 14px; }

    /* One labelled row: "TRAINING TOPICS  [1 · …][2 · …][3 · …]". The label is
       what turns three bare buttons into an explained choice; keep it. */
    .lecture-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .lecture-label {
      font-size: 11.5px; font-weight: 600; color: #7c8ba1;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Segmented control, not three loose buttons: one bordered group with
       hairline dividers, so the three lectures read as one choice. The IDs stay
       btn-vid1/2/3 — videosphere.ts and the in-VR HUD bind to them by id. */
    .lecture-group {
      display: inline-flex;
      border: 1px solid #334155; border-radius: 7px; overflow: hidden;
    }
    .lecture-group button {
      background: transparent; border: none;
      border-left: 1px solid #334155;
      color: #94a3b8; padding: 7px 15px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    .lecture-group button:first-child { border-left: none; }
    .lecture-group button.active { background: #334155; color: #f1f5f9; font-weight: 600; }
    .lecture-group button:hover:not(.active) { background: #273449; color: #e2e8f0; }
    .lecture-group button:focus-visible { outline: 2px solid #3b82f6; outline-offset: -2px; }

    .video-summary {
      margin: 0; font-size: 13px; line-height: 1.6; color: #a8b6c8;
      /* Caps the measure. Unbounded, this line runs the full width of the video
         (~180 characters) and the eye loses its place on the return sweep, which
         is half of why the summary read as unreadable. 138ch lands it at ~125
         and costs one extra line; tighter measures cost two, and this bar's
         height comes out of the video. */
      max-width: 138ch;
    }
    .video-summary strong { color: #cbd5e1; }

    .video-bar .transport-row button {
      background: #3b82f6; border: none; border-radius: 6px;
      color: white; padding: 8px 18px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
    }
    .video-bar .transport-row button:hover { background: #2563eb; }

    /* Play and mute carry their STATE in colour, not just in the label. Slate
       means "running, nothing needs you"; the accent means something is
       stopping you and the button is what clears it. The state classes are set
       from videosphere.ts, and the in-VR HUD buttons fire the same DOM click
       (hud.ts:235,238), so the colour can never drift from the video. */
    .video-bar .transport-row button#btn-play,
    .video-bar .transport-row button#btn-mute {
      background: #475569; box-shadow: inset 0 0 0 1px #64748b;
    }
    .video-bar .transport-row button#btn-play:hover,
    .video-bar .transport-row button#btn-mute:hover { background: #64748b; }

    /* Paused: the same blue as the progress bar and Enter VR — press to resume. */
    .video-bar .transport-row button#btn-play.is-paused {
      background: #3b82f6; box-shadow: inset 0 0 0 1px #60a5fa;
    }
    .video-bar .transport-row button#btn-play.is-paused:hover { background: #2563eb; }

    /* Muted: amber, not slate. The narration IS the training, so silence is a
       degraded state and earns a warning tint. #b45309 keeps white text at
       5.0:1; the brighter amber-500s drop under 3:1 and stop being readable. */
    .video-bar .transport-row button#btn-mute.is-muted {
      background: #b45309; box-shadow: inset 0 0 0 1px #d97706;
    }
    .video-bar .transport-row button#btn-mute.is-muted:hover { background: #92400e; }
    #video-time { font-size: 13px; color: #a8b6c8; margin-left: auto; }
    #progress-bar-wrap {
      flex: 1; height: 24px; cursor: pointer; position: relative;
      user-select: none; touch-action: none;
      display: flex; align-items: center;
    }
    #progress-track {
      position: absolute; left: 0; right: 0; height: 6px;
      background: #334155; border-radius: 3px; overflow: hidden; pointer-events: none;
    }
    #progress-bar { height: 100%; background: #3b82f6; border-radius: 3px; width: 0%; pointer-events: none; }
    #progress-thumb {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; background: white; border-radius: 50%;
      pointer-events: none; left: 0%; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* The panel's own styling lives in src/chat-panel.css (shared with
       chat.html). Only its width in this layout belongs here. */
    .chat-panel { width: 400px; flex-shrink: 0; }


    /* Narrow viewport (a phone, or this page in a half-width window): a 400px
       chat column beside the video leaves the video unwatchable, so stack them.
       Only applies below 760px — a Quest Browser viewport is far wider, so the
       headset layout is untouched. */
    @media (max-width: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .main { flex-direction: column; overflow: visible; }
      .viewer-panel { border-right: none; border-bottom: 1px solid #334155; }
      #scene-container { flex: none; height: 52vh; }
      .chat-panel { width: 100%; height: 70vh; }
    }

    /* -- Lucide icons (github.com/lucide-icons/lucide, ISC) --
       Sizing and the shared `.icon` base live in src/chat-panel.css, which
       src/index.ts imports; these two are portal chrome only. */
    header .logo-icon { width: 20px; height: 20px; vertical-align: 0; }
    .transport-row .icon { margin-right: 5px; }
  </style>
</head>
<body>

<header>
  <div class="logo"><svg class="icon logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
  <h1>360° Training Video</h1>
  <span class="hint">Drag to look around the scene</span>
</header>

<div class="main">

  <div class="viewer-panel">
    <!-- IWSDK World renders into this container -->
    <div id="scene-container"></div>

    <div class="video-bar">
      <div class="transport-row">
        <button id="btn-play"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg> Pause</button>
        <button id="btn-mute"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg> Mute</button>
        <div id="progress-bar-wrap" title="Click or drag to seek">
          <div id="progress-track"><div id="progress-bar"></div></div>
          <div id="progress-thumb"></div>
        </div>
        <span id="video-time">0:00 / 0:00</span>
        <button id="btn-enter-vr" title="Enter VR (or use IWER emulator on desktop)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/></svg> Enter VR</button>
      </div>

      <div class="lecture-row">
        <span class="lecture-label" id="lecture-label">Training topics</span>
        <div class="lecture-group" role="group" aria-labelledby="lecture-label">
          <button id="btn-vid1" class="active" title="Part 1 — EV emergency-response fundamentals">1 · Fundamentals</button>
          <button id="btn-vid2" title="Part 2 — charging system &amp; HV battery hardware">2 · Charging &amp; Battery</button>
          <button id="btn-vid3" title="Part 3 — battery fire response &amp; disconnects">3 · Fire Response</button>
        </div>
      </div>

      <p id="video-summary" class="video-summary"></p>
    </div>

  </div>

  <div class="chat-panel">

    <div class="chat-messages" id="chat-messages">
      <!-- Kept byte-identical with the same block in chat.html: it is one panel
           in two places, so the empty state must not read as two products.
           chat.ts clones this node and puts it back when the chat is cleared. -->
      <div class="chat-empty" id="chat-empty">
        <h2>Training Assistant</h2>
        <p>Tap the prompts below to get started or ask on your own.</p>
        <button class="prompt-chip" type="button">How do I shut down the high-voltage system?</button>
        <button class="prompt-chip" type="button">What do I do if the battery is on fire?</button>
        <button class="prompt-chip" type="button">Where are the no-cut zones?</button>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1"
          placeholder="Ask a question..."></textarea>
        <button id="mic-btn" title="Voice input" aria-label="Voice input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></button>
        <button id="send-btn" title="Send" aria-label="Send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
      </div>
      <div class="input-hint-row">
        <span class="input-hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for newline</span>
        <button id="clear-btn" type="button" title="Clear this conversation and start a new session" hidden>Clear</button>
      </div>
      <div id="error-banner"></div>
    </div>
  </div>

</div>

<script type="module" src="/src/index.ts"></script>
</body>
</html>
