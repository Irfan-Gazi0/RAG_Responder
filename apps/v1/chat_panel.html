<!DOCTYPE html>
<!--
  RETIRED 2026-09-07. The Streamlit "EV Explorer" tab now embeds /chat.html,
  a second entry of the v2 bundle (apps/portal/chat.html) built from the same
  markup, CSS and client as the portal's own chat panel — which is what makes
  the two tabs show one conversation instead of two.

  Nothing links here any more. Do not fix bugs in this copy; fix them in
  apps/portal/src/chat.ts and apps/portal/src/chat-panel.css.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Assistant</title>

  <!-- Marked.js — render Markdown in chat -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f172a;
    }
    .chat-header {
      background: #1e293b;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
    }
    .msg .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user { align-items: flex-end; }
    .msg.user .bubble {
      background: #b91c1c;
      color: #fef2f2;
      border-bottom-right-radius: 4px;
    }
    .msg.bot { align-items: flex-start; }
    .msg.bot .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid #334155;
    }
    .msg .label {
      font-size: 10.5px;
      color: #64748b;
      padding: 0 2px;
    }
    .msg.bot .bubble table {
      border-collapse: collapse;
      font-size: 12px;
      margin: 6px 0;
      width: 100%;
      overflow-x: auto;
      display: block;
    }
    .msg.bot .bubble th, .msg.bot .bubble td {
      border: 1px solid #334155;
      padding: 5px 8px;
      text-align: left;
    }
    .msg.bot .bubble th { background: #0f172a; font-weight: 600; }
    .msg.bot .bubble code {
      background: #0f172a;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
    }
    .msg.bot .bubble h3, .msg.bot .bubble h4 {
      margin: 8px 0 4px;
      color: #fca5a5;
      font-size: 13px;
    }
    .msg.bot .bubble ul, .msg.bot .bubble ol {
      padding-left: 18px;
      margin: 4px 0;
    }
    .msg.bot .bubble strong { color: #fecaca; }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }
    .typing .bubble span {
      width: 7px; height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing .bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing .bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* Input area */
    .chat-input-wrap {
      border-top: 1px solid #334155;
      padding: 12px 16px;
      background: #1e293b;
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13.5px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
    }
    #chat-input:focus { border-color: #ef4444; }
    #chat-input::placeholder { color: #475569; }
    #send-btn {
      background: #ef4444;
      border: none;
      border-radius: 10px;
      color: white;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #dc2626; }
    #send-btn:disabled { background: #334155; cursor: not-allowed; }
    #mic-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #94a3b8;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #mic-btn:hover { background: #334155; color: #e2e8f0; }
    #mic-btn.recording {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fca5a5;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
    }
    .input-hint {
      font-size: 10.5px;
      color: #475569;
      margin-top: 6px;
    }
    #error-banner {
      display: none;
      align-items: center;
      gap: 6px;
      background: #450a0a;
      border: 1px solid #991b1b;
      color: #fca5a5;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 6px;
      margin-top: 8px;
    }

    /* ── Lucide icons (github.com/lucide-icons/lucide, ISC) ── */
    .icon { width: 15px; height: 15px; vertical-align: -2px; flex-shrink: 0; }
    #mic-btn .icon, #send-btn .icon { width: 18px; height: 18px; vertical-align: 0; }
    #error-banner .icon { width: 14px; height: 14px; vertical-align: 0; }
    .input-hint .icon { width: 12px; height: 12px; vertical-align: -1px; }

    /* Empty state — removed on the first message and never rebuilt. */
    .chat-empty { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
    .chat-empty p { font-size: 12.5px; color: #64748b; margin-bottom: 4px; }
    .prompt-chip {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      color: #cbd5e1; font-family: inherit; font-size: 12.5px; line-height: 1.4;
      padding: 9px 12px; text-align: left; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .prompt-chip:hover { background: #273449; border-color: #475569; }
    .prompt-chip:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
  </style>
</head>
<body>

<div class="chat-panel">
  <div class="chat-header"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>Training Assistant</div>

  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty" id="chat-empty">
      <p>Ask about this vehicle.</p>
      <button class="prompt-chip" type="button">How do I shut down the high-voltage system?</button>
      <button class="prompt-chip" type="button">What do I do if the battery is on fire?</button>
      <button class="prompt-chip" type="button">Where are the no-cut zones?</button>
    </div>
  </div>

  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Ask about HV shutdown, fire response, no-cut zones..."
      ></textarea>
      <button id="mic-btn" title="Voice input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></button>
      <button id="send-btn" title="Send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
    </div>
    <div class="input-hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for newline &nbsp;·&nbsp; <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg> for voice</div>
    <div id="error-banner"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span id="error-text"></span></div>
  </div>
</div>

<script>
// NOTE: this chat + voice block is intentionally duplicated in inspector_portal.html
// (each file is a standalone CloudFront artifact — no bundler). Keep both in sync.
const WEBHOOK_URL  = "https://irfangazi.app.n8n.cloud/webhook/a7782f7b-3403-48c3-9e6d-c14772a002a1";

// localStorage so the same session_id is shared across all tabs from this origin
const SESSION_ID = (() => {
  let id = localStorage.getItem("fr_session_id");
  if (!id) { id = crypto.randomUUID(); localStorage.setItem("fr_session_id", id); }
  return id;
})();

const messagesEl = document.getElementById("chat-messages");
const inputEl    = document.getElementById("chat-input");
const sendBtn    = document.getElementById("send-btn");
const errorEl    = document.getElementById("error-banner");
const errorText  = document.getElementById("error-text");

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}

function addMessage(role, text) {
  document.getElementById("chat-empty")?.remove();

  const wrap   = document.createElement("div");
  wrap.className = `msg ${role}`;
  const label  = document.createElement("span");
  label.className = "label";
  label.textContent = role === "user" ? "You" : "Training Assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "bot") {
    bubble.innerHTML = marked.parse(text);
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot typing";
  wrap.innerHTML = `
    <span class="label">Training Assistant</span>
    <div class="bubble"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function parseN8nResponse(data) {
  if (Array.isArray(data) && data.length > 0) data = data[0];
  if (typeof data === "object" && data !== null) {
    return data.output || data.text || data.response || data.answer || JSON.stringify(data);
  }
  return String(data);
}

async function sendMessage() {
  const question = inputEl.value.trim();
  if (!question) return;

  errorEl.style.display = "none";
  inputEl.value = "";
  autoGrow();
  sendBtn.disabled = true;

  addMessage("user", question);
  const typingEl = addTyping();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ question, session_id: SESSION_ID }),
    });
    typingEl.remove();
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.message || detail.detail || `Webhook error ${res.status}`);
    }
    const data   = await res.json();
    const answer = parseN8nResponse(data);
    addMessage("bot", answer);
  } catch (err) {
    typingEl.remove();
    errorEl.style.display = "flex";
    errorText.textContent = err.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

inputEl.addEventListener("input", autoGrow);

sendBtn.addEventListener("click", sendMessage);

document.querySelectorAll(".prompt-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    inputEl.value = chip.textContent.trim();
    sendMessage();
  });
});

// ── VOICE INPUT (Web Speech API — browser-native, no API key) ──
const micBtn = document.getElementById("mic-btn");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if (!SpeechRecognition) {
  micBtn.disabled = true;
  micBtn.title    = "Voice input not supported in this browser";
} else {
  micBtn.addEventListener("click", () => {
    if (isRecording) { recognition && recognition.stop(); return; }
    startRecognition();
  });
}

function startRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang           = "en-US";
  recognition.interimResults = true;
  recognition.continuous     = false;

  // Preserve anything already typed; recognized text is appended to it
  const baseText = inputEl.value.trim();

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add("recording");
    micBtn.title = "Listening… click to stop";
  };

  recognition.onresult = (e) => {
    let transcript = "";
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    inputEl.value = [baseText, transcript.trim()].filter(Boolean).join(" ");
    autoGrow();
  };

  recognition.onerror = (e) => {
    errorEl.style.display = "flex";
    errorText.textContent = (e.error === "not-allowed" || e.error === "service-not-allowed")
      ? "Microphone access denied. Allow mic permissions and try again."
      : `Voice input error: ${e.error}`;
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.title = "Voice input";
    inputEl.focus();
  };

  recognition.start();
}
</script>
</body>
</html>
